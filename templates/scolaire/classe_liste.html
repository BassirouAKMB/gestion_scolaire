{% extends 'base/base.html' %}
{% block title %}Classes{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-diagram-3"></i> Liste des Classes</h2>
    <a href="/classes/ajouter/" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Ajouter
    </a>
</div>
<div class="card p-3">
    <table class="table table-hover">
        <thead class="table-primary">
            <tr>
                <th>Nom</th>
                <th>Filière</th>
                <th>Niveau</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for c in classes %}
            <tr>
                <td>{{ c.nom }}</td>
                <td>{{ c.filiere }}</td>
                <td>{{ c.niveau }}</td>
                <td>
                    <a href="/classes/{{ c.id }}/modifier/" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a href="/classes/{{ c.id }}/supprimer/" class="btn btn-sm btn-danger">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="4" class="text-center text-muted py-4">Aucune classe enregistrée.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
