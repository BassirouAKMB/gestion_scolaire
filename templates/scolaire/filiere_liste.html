{% extends 'base/base.html' %}
{% block title %}Filières{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-collection"></i> Liste des Filières</h2>
    <a href="/filieres/ajouter/" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Ajouter
    </a>
</div>
<div class="card p-3">
    <table class="table table-hover">
        <thead class="table-primary">
            <tr>
                <th>Nom</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for f in filieres %}
            <tr>
                <td>{{ f.nom }}</td>
                <td>{{ f.description }}</td>
                <td>
                    <a href="/filieres/{{ f.id }}/modifier/" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a href="/filieres/{{ f.id }}/supprimer/" class="btn btn-sm btn-danger">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="text-center text-muted py-4">Aucune filière enregistrée.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
